[package]
name = "sesame-app"
version = "0.5.2"
license = "AGPL-3.0-or-later"
description = "Platform-independent Sesame application rules: vault lifecycle, item policies, Sync, the browser protocol, and the service adapters they need."
authors = ["Sesame"]
edition = "2021"

[features]
test-support = ["dep:tokio"]
wdio = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"

[dependencies]
sesame-core = { path = "../sesame-core" }
base64 = "0.23"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
ed25519-dalek = "3"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
idna = "1"
psl = "2"
unicode-security = "0.1"
url = "2.5"
zeroize = { version = "1.8", features = ["derive"] }
curve25519-dalek = "5"
x25519-dalek = { version = "3", features = ["static_secrets"] }
hkdf = "0.13"
ts-rs = "12.0.1"
ml-kem = { version = "=0.3.4", features = ["zeroize"] }
sha3 = "=0.12.0"
shake = "0.1"
tokio = { version = "=1.53.3", features = ["net", "rt", "time"], optional = true }

[dev-dependencies]
tokio = { version = "=1.53.3", features = ["net", "rt", "time"] }
