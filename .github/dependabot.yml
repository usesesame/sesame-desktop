version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 ships no compiler API, so typescript-eslint and
      # svelte-check run on the TypeScript 6 API behind the typescript alias.
      # The native compiler is tracked separately as @typescript/native.
      - dependency-name: typescript
        versions: [">=7.0.0"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      cargo-patch:
        update-types: [patch]
      cargo-minor:
        update-types: [minor]
    ignore:
      - dependency-name: windows-core
        versions: [">=0.63.0"]
      - dependency-name: zbus
        versions: [">=6.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
