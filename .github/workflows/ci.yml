name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This repository is the desktop app on its own. The API, website, account
# portal, admin app, and browser extension have their own repositories and
# their own CI, so nothing here builds them.
#
# Linux runs the cheap checks for fast feedback. Both platforms build the
# desktop app and its packages.
#
# `npm run desktop:ci` runs the same owned command surface locally.

# Read-only by default. A job that needs more asks for it itself; nothing here
# writes to the repository, and the release workflow is where publishing lives.
permissions:
  contents: read

env:
  # Build-only non-routable endpoints. Deployed origins are supplied by the
  # release environment; no production domain is compiled into clients.
  VITE_SESAME_SITE_ORIGIN: https://website.test.invalid
  SESAME_API_BASE_URL: https://api.test.invalid

jobs:
  # ---------------------------------------------------------------------
  # Fast feedback. These finish in a couple of minutes and catch most of
  # what a reviewer would otherwise catch by hand.
  # ---------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Require npm to read the intake policy
        run: |
          test "$(npm config get ignore-scripts)" = "true"
          test "$(npm config get allow-git)" = "none"
          test "$(npm config get audit-level)" = "high"
          test "$(npm config get min-release-age)" = "7"

      - name: Check the version contract
        run: npm run desktop:version:check

      - name: Lint TypeScript and Svelte
        run: npm run desktop:lint:js

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Type check and unit test the desktop app
        run: npm run desktop:check

      - name: Check the desktop boundary
        run: npm run desktop:contracts

  # ---------------------------------------------------------------------
  # The desktop itself: the vault core, the interface, and a production
  # build. Windows because the core depends on windows-sys.
  #
  # clippy runs without `-D warnings` on purpose. The lints that must not
  # regress are `deny` in src-tauri/Cargo.toml, so clippy already fails this
  # job when one appears.
  # ---------------------------------------------------------------------
  desktop:
    needs: [lint, typecheck]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci

      # Version contract, lint, contracts, type check, frontend build, rustfmt,
      # clippy, and the vault core tests with and without the Sync feature.
      # This step stages the native messaging host itself, which every cargo
      # command that compiles the crate needs: tauri-build validates the
      # externalBin sidecar declared in tauri.conf.json.
      - name: Run the desktop checks
        run: npm run desktop:ci

      # Catches a production build or installer template that only breaks
      # under release settings. Unsigned, with no updater artifacts.
      - name: Build the unsigned Windows installer
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'ci-updater-off.json'
          Set-Content -LiteralPath $config -Value '{"bundle":{"createUpdaterArtifacts":false}}' -Encoding ascii -NoNewline
          npx tauri build --bundles nsis --config $config -- --locked

      - name: Install, reinstall and uninstall the Windows installer
        shell: powershell
        run: |
          $installers = @(Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installers.Count)." }
          ./tools/test-windows-installer.ps1 -InstallerPath $installers[0].FullName

  desktop-linux:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: linux
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the webview and tray libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsecret-tools \
            patchelf \
            xdg-utils \
            rpm \
            dbus \
            bubblewrap \
            xdg-dbus-proxy \
            xvfb

      - name: Allow unprivileged user namespaces for the web view sandbox
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --unshare-pid --unshare-net --ro-bind / / --dev /dev --proc /proc /usr/bin/true

      - run: npm ci

      - name: Check generated TypeScript bindings are current
        run: |
          npm run types:generate
          if [ -n "$(git status --porcelain -- src/lib/generated)" ]; then
            echo "src/lib/generated is out of date. Run 'npm run types:generate' and commit the result." >&2
            git status --porcelain -- src/lib/generated >&2
            exit 1
          fi

      - name: Check Linux desktop prerequisites
        run: npm run desktop:linux:bundle-prerequisites

      - name: Build the frontend
        run: npm run desktop:build

      - name: Lint and test the vault core
        run: |
          npm run desktop:lint:rust
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          cargo test --manifest-path src-tauri/Cargo.toml --features sync-preview --locked

      # The host registers its manifests, unregisters them, and then completes
      # an authenticated native-messaging exchange with the live broker.
      - name: Prove the browser host talks to the live desktop broker
        run: xvfb-run -a dbus-run-session -- node tools/test-browser-host-pipe.mjs

      - name: Pin the Linux bundling tools by version and hash
        run: node tools/prepare-linux-bundle-tools.mjs

      - name: Build the Linux bundles
        run: >-
          npm run tauri -- build --bundles deb,rpm,appimage
          --config '{"bundle":{"createUpdaterArtifacts":false,"useLocalToolsDir":true}}'
          -- --locked

      - name: Prove the shipped rpm installs, launches, and unregisters
        run: |
          xvfb-run -a node tools/linux-shipped-package-gate.mjs \
            --format rpm \
            --package "$(ls src-tauri/target/release/bundle/rpm/*.rpm)" \
            --out linux-rpm-shipped-evidence

      - name: Prove the shipped AppImage launches and refuses registration
        run: |
          if ! xvfb-run -a node tools/linux-shipped-package-gate.mjs \
            --format appimage \
            --package "$(ls src-tauri/target/release/bundle/appimage/*.AppImage)" \
            --out linux-appimage-shipped-evidence; then
            echo "--- launch log ---"
            cat linux-appimage-shipped-evidence/linux-appimage-launch.log 2>/dev/null || true
            echo "--- record ---"
            cat linux-appimage-shipped-evidence/*.json 2>/dev/null || true
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: linux-appimage-failure
          path: linux-appimage-shipped-evidence
          if-no-files-found: ignore
          retention-days: 7

      # The shipped binary has no test bridge, so the package that installs
      # here is the test-featured build. It exercises the real deb layout,
      # dpkg install, launch, vault operations, restart, and removal.
      - name: Prove the installed package lifecycle
        env:
          VITE_SESAME_WDIO: 'true'
        run: |
          npx tauri build --features wdio --config src-tauri/tauri.wdio.conf.json --bundles deb -- --locked
          xvfb-run -a node tools/linux-installed-package-gate.mjs \
            --package "$(ls src-tauri/target/release/bundle/deb/Sesame_*_amd64.deb)" \
            --out linux-package-evidence

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-package-evidence
          path: linux-package-evidence
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------
  # Supply chain. Independent of the product jobs, so a new advisory does
  # not read as a broken build.
  # ---------------------------------------------------------------------
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Secret scanning must inspect repository history, not only HEAD.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      # Only so the pinned gitleaks CLI below can be built from source. No Go
      # code ships from this repository.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache-dependency-path: .github/workflows/ci.yml

      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: audit-0.22.2
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Build the desktop frontend for shipped-package evidence
        run: npm run desktop:build

      - name: Generate locked SBOM and provenance
        run: npm run supply-chain:sbom

      - name: Verify the vendored glib tree
        run: node tools/verify-glib-vendor.mjs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-evidence
          path: release-evidence
          retention-days: 30

      - name: Install Rust audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Scan for secrets
        # The hosted action requires a commercial licence for organization
        # repositories. Run the pinned open-source CLI directly instead.
        run: >-
          go run github.com/zricethezav/gitleaks/v8@v8.30.1
          git --redact --verbose .
