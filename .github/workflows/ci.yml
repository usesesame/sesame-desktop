name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This repository is the desktop app on its own. The API, website, account
# portal, admin app, and browser extension have their own repositories and
# their own CI, so nothing here builds them.
#
# Linux runs the cheap checks for fast feedback. Both platforms build the
# desktop app and its packages.
#
# `npm run desktop:ci` runs the same owned command surface locally.

# Read-only by default. A job that needs more asks for it itself; nothing here
# writes to the repository, and the release workflow is where publishing lives.
permissions:
  contents: read

env:
  # Build-only non-routable endpoints. Deployed origins are supplied by the
  # release environment; no production domain is compiled into clients.
  VITE_SESAME_SITE_ORIGIN: https://website.test.invalid
  SESAME_API_BASE_URL: https://api.test.invalid

jobs:
  # ---------------------------------------------------------------------
  # Fast feedback. These finish in a couple of minutes and catch most of
  # what a reviewer would otherwise catch by hand.
  # ---------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Require npm to read the intake policy
        run: |
          test "$(npm config get ignore-scripts)" = "true"
          test "$(npm config get allow-git)" = "none"
          test "$(npm config get audit-level)" = "high"
          test "$(npm config get min-release-age)" = "7"

      - name: Check the version contract
        run: npm run desktop:version:check

      - name: Lint TypeScript and Svelte
        run: npm run desktop:lint:js

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Type check and unit test the desktop app
        run: npm run desktop:check

      - name: Check the desktop boundary
        run: npm run desktop:contracts

  # ---------------------------------------------------------------------
  # The desktop itself: the vault core, the interface, and a production
  # build. Windows because the core depends on windows-sys.
  #
  # The work is split into independent jobs so the slowest one sets the
  # wall-clock time. `desktop` and `desktop-linux` stay as the required
  # checks and pass only when every job behind them passed.
  #
  # clippy runs without `-D warnings` on purpose. The lints that must not
  # regress are `deny` in src-tauri/Cargo.toml, so clippy already fails this
  # job when one appears.
  # ---------------------------------------------------------------------
  windows-js:
    needs: [lint, typecheck]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Check the version contract
        run: npm run desktop:version:check

      - name: Lint TypeScript and Svelte
        run: npm run desktop:lint:js

      - name: Check the dependency admission record
        run: npm run desktop:dependency:admission

      - name: Run the contract tests
        run: npm run desktop:contracts

      - name: Type check and unit test the desktop app
        run: npm run desktop:check

      - name: Build the frontend
        run: npm run desktop:build

  # Every cargo command that compiles the crate needs the staged native
  # messaging host, because tauri-build validates the externalBin sidecar
  # declared in tauri.conf.json. The `desktop:lint:rust` and `desktop:test:*`
  # scripts stage it themselves.
  windows-rust-lint:
    needs: [lint, typecheck]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci

      - name: Build the frontend
        run: npm run desktop:build

      - name: Check formatting and run clippy
        run: npm run desktop:lint:rust

  windows-rust-test:
    needs: [lint, typecheck]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci

      - name: Build the frontend
        run: npm run desktop:build

      - name: Run the vault core tests
        run: npm run desktop:test:rust

  windows-rust-test-sync:
    needs: [lint, typecheck]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: sync
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci

      - name: Build the frontend
        run: npm run desktop:build

      - name: Run the vault core tests with Sync
        run: npm run desktop:test:rust:sync

  windows-installer:
    needs: [lint, typecheck]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: installer
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci

      # Catches a production build or installer template that only breaks
      # under release settings. Unsigned, with no updater artifacts.
      - name: Build the unsigned Windows installer
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'ci-updater-off.json'
          Set-Content -LiteralPath $config -Value '{"bundle":{"createUpdaterArtifacts":false}}' -Encoding ascii -NoNewline
          npx tauri build --bundles nsis --config $config -- --locked

      - name: Install, reinstall and uninstall the Windows installer
        shell: powershell
        run: |
          $installers = @(Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installers.Count)." }
          ./tools/test-windows-installer.ps1 -InstallerPath $installers[0].FullName

  desktop:
    needs: [windows-js, windows-rust-lint, windows-rust-test, windows-rust-test-sync, windows-installer]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Windows job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            test "$result" = "success"
          done

  linux-rust:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: linux-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the webview and tray libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsecret-tools \
            patchelf \
            xdg-utils \
            rpm \
            dbus \
            bubblewrap \
            xdg-dbus-proxy \
            xvfb

      - name: Allow unprivileged user namespaces for the web view sandbox
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --unshare-pid --unshare-net --ro-bind / / --dev /dev --proc /proc /usr/bin/true

      - run: npm ci

      - name: Check generated TypeScript bindings are current
        run: |
          npm run types:generate
          if [ -n "$(git status --porcelain -- src/lib/generated)" ]; then
            echo "src/lib/generated is out of date. Run 'npm run types:generate' and commit the result." >&2
            git status --porcelain -- src/lib/generated >&2
            exit 1
          fi

      - name: Build the frontend
        run: npm run desktop:build

      - name: Lint and test the vault core
        run: |
          npm run desktop:lint:rust
          cargo test --manifest-path src-tauri/Cargo.toml --locked

      # The host registers its manifests, unregisters them, and then completes
      # an authenticated native-messaging exchange with the live broker.
      - name: Prove the browser host talks to the live desktop broker
        run: xvfb-run -a dbus-run-session -- node tools/test-browser-host-pipe.mjs

      - name: Read the pinned Sync server commit
        id: sync-server-pin
        run: |
          echo "repository=$(jq -r .repository src-tauri/contracts/sync/server-pin.json)" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq -r .commit src-tauri/contracts/sync/server-pin.json)" >> "$GITHUB_OUTPUT"
          echo "older=$(jq -r .olderCommit src-tauri/contracts/sync/server-pin.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.sync-server-pin.outputs.repository }}
          ref: ${{ steps.sync-server-pin.outputs.commit }}
          path: sesame-server
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.sync-server-pin.outputs.repository }}
          ref: ${{ steps.sync-server-pin.outputs.older }}
          path: sesame-server-older
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sesame-server/go.mod
          cache: false

      # The client and the sync engine talk to the real Go service built from
      # the pinned commit, and a second service built from an older commit that
      # does not accept the hybrid device key. Each run fails unless exactly one
      # test ran and passed.
      - name: Prove Sync round trips against the real server
        run: |
          set -euo pipefail
          mkdir -p sesame-server-older/cmd/synctestserver
          cp sesame-server/cmd/synctestserver/main.go sesame-server-older/cmd/synctestserver/main.go
          (cd sesame-server && go build -tags synctestserver -o "$RUNNER_TEMP/synctestserver" ./cmd/synctestserver)
          (cd sesame-server-older && go build -tags synctestserver -o "$RUNNER_TEMP/synctestserver-older" ./cmd/synctestserver)
          "$RUNNER_TEMP/synctestserver" > "$RUNNER_TEMP/synctestserver.out" &
          server=$!
          "$RUNNER_TEMP/synctestserver-older" > "$RUNNER_TEMP/synctestserver-older.out" &
          older=$!
          trap 'kill "$server" "$older" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            grep -q '^KEY=' "$RUNNER_TEMP/synctestserver.out" && grep -q '^KEY=' "$RUNNER_TEMP/synctestserver-older.out" && break
            sleep 0.2
          done
          export SESAME_SYNC_E2E_URL="$(sed -n 's/^URL=//p' "$RUNNER_TEMP/synctestserver.out")"
          export SESAME_SYNC_E2E_KEY="$(sed -n 's/^KEY=//p' "$RUNNER_TEMP/synctestserver.out")"
          export SESAME_SYNC_E2E_OLD_URL="$(sed -n 's/^URL=//p' "$RUNNER_TEMP/synctestserver-older.out")"
          export SESAME_SYNC_E2E_OLD_KEY="$(sed -n 's/^KEY=//p' "$RUNNER_TEMP/synctestserver-older.out")"
          test -n "$SESAME_SYNC_E2E_URL" && test -n "$SESAME_SYNC_E2E_KEY"
          test -n "$SESAME_SYNC_E2E_OLD_URL" && test -n "$SESAME_SYNC_E2E_OLD_KEY"
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib \
            the_rust_client_and_engine_round_trip_against_the_real_service -- --ignored 2>&1 | tee "$RUNNER_TEMP/sync-e2e.out"
          grep -q 'test result: ok. 1 passed' "$RUNNER_TEMP/sync-e2e.out"
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib \
            a_hybrid_approver_pairs_an_older_device_only_when_the_person_allows_it -- --ignored 2>&1 | tee "$RUNNER_TEMP/sync-e2e-mixed.out"
          grep -q 'test result: ok. 1 passed' "$RUNNER_TEMP/sync-e2e-mixed.out"
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib \
            devices_with_the_older_key_replace_it_and_the_vault_key_rotates_through_the_real_service -- --ignored 2>&1 | tee "$RUNNER_TEMP/sync-e2e-keys.out"
          grep -q 'test result: ok. 1 passed' "$RUNNER_TEMP/sync-e2e-keys.out"
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib \
            a_hybrid_device_is_told_when_the_service_does_not_accept_its_key_yet -- --ignored 2>&1 | tee "$RUNNER_TEMP/sync-e2e-older.out"
          grep -q 'test result: ok. 1 passed' "$RUNNER_TEMP/sync-e2e-older.out"

  linux-bundles:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: linux-bundles
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the webview and tray libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsecret-tools \
            patchelf \
            xdg-utils \
            rpm \
            dbus \
            bubblewrap \
            xdg-dbus-proxy \
            xvfb
          sudo apt-get install --only-upgrade --no-install-recommends -y \
            curl \
            libcurl3t64-gnutls \
            libcurl4t64

      - name: Allow unprivileged user namespaces for the web view sandbox
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --unshare-pid --unshare-net --ro-bind / / --dev /dev --proc /proc /usr/bin/true

      - run: npm ci

      - name: Check Linux desktop prerequisites
        run: npm run desktop:linux:bundle-prerequisites

      - name: Build the frontend
        run: npm run desktop:build

      - name: Pin the Linux bundling tools by version and hash
        run: node tools/prepare-linux-bundle-tools.mjs

      - name: Build the Linux bundles
        run: >-
          npm run tauri -- build --bundles deb,rpm,appimage
          --config '{"bundle":{"createUpdaterArtifacts":false,"useLocalToolsDir":true}}'
          -- --locked

      # The test only has assertions on Linux, and the optimized build is the
      # one it exists to check, so it runs against the release artifacts above.
      - name: Check the vendored glib patches in an optimized build
        run: npm run desktop:test:glib

      - name: Strip host libraries and patch the sandbox paths from the AppImage
        run: node tools/strip-appimage-host-libs.mjs "$(ls src-tauri/target/release/bundle/appimage/*.AppImage)"

      - name: Prove the shipped rpm installs, launches, and unregisters
        run: |
          xvfb-run -a node tools/linux-shipped-package-gate.mjs \
            --format rpm \
            --package "$(ls src-tauri/target/release/bundle/rpm/*.rpm)" \
            --out linux-rpm-shipped-evidence

      - name: Prove the shipped AppImage launches and stages its browser helper
        run: |
          if ! xvfb-run -a node tools/linux-shipped-package-gate.mjs \
            --format appimage \
            --package "$(ls src-tauri/target/release/bundle/appimage/*.AppImage)" \
            --out linux-appimage-shipped-evidence; then
            echo "--- launch log ---"
            cat linux-appimage-shipped-evidence/linux-appimage-launch.log 2>/dev/null || true
            echo "--- record ---"
            cat linux-appimage-shipped-evidence/*.json 2>/dev/null || true
            exit 1
          fi

      - name: Audit the bundled AppImage libraries against OSV advisories
        run: |
          mkdir -p appimage-sbom
          npm run supply-chain:sbom:appimage -- \
            --appimage "$(ls src-tauri/target/release/bundle/appimage/*.AppImage)" \
            --out appimage-sbom/sesame-appimage.cdx.json
          npm run supply-chain:sbom:audit -- --sbom appimage-sbom/sesame-appimage.cdx.json

  linux-installed:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: linux-installed
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the webview and tray libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsecret-tools \
            patchelf \
            xdg-utils \
            rpm \
            dbus \
            bubblewrap \
            xdg-dbus-proxy \
            xvfb

      - name: Allow unprivileged user namespaces for the web view sandbox
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --unshare-pid --unshare-net --ro-bind / / --dev /dev --proc /proc /usr/bin/true

      - run: npm ci

      # The shipped binary has no test bridge, so the package that installs
      # here is the test-featured build. It exercises the real deb layout,
      # dpkg install, launch, vault operations, restart, and removal.
      - name: Prove the installed package lifecycle
        env:
          VITE_SESAME_WDIO: 'true'
        run: |
          npm run desktop:host:stage
          npx tauri build --features wdio --config src-tauri/tauri.wdio.conf.json --bundles deb -- --locked
          xvfb-run -a node tools/linux-installed-package-gate.mjs \
            --package "$(ls src-tauri/target/release/bundle/deb/Sesame_*_amd64.deb)" \
            --out linux-package-evidence

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-package-evidence
          path: linux-package-evidence
          if-no-files-found: error
          retention-days: 30

  desktop-linux:
    needs: [linux-rust, linux-bundles, linux-installed]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Linux job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            test "$result" = "success"
          done

  # ---------------------------------------------------------------------
  # Supply chain. Independent of the product jobs, so a new advisory does
  # not read as a broken build.
  # ---------------------------------------------------------------------
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Secret scanning must inspect repository history, not only HEAD.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      # Only so the pinned gitleaks CLI below can be built from source. No Go
      # code ships from this repository.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache-dependency-path: .github/workflows/ci.yml

      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: audit-0.22.2
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci

      - name: Build the desktop frontend for shipped-package evidence
        run: npm run desktop:build

      - name: Generate locked SBOM and provenance
        run: npm run supply-chain:sbom

      - name: Verify the vendored glib tree
        run: node tools/verify-glib-vendor.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supply-chain-evidence
          path: release-evidence
          retention-days: 30

      - name: Install Rust audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit npm and Rust dependencies against the reviewed exceptions
        run: node tools/audit-dependencies.mjs

      - name: Scan for secrets
        # The hosted action requires a commercial licence for organization
        # repositories. Run the pinned open-source CLI directly instead.
        run: >-
          go run github.com/zricethezav/gitleaks/v8@v8.30.1
          git --redact --verbose .
