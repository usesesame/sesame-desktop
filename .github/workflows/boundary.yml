name: Boundary

on:
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The standalone copy runs the same owned command as `desktop:ci`, one part
  # per job so the slowest part sets the wall-clock time. The parts together
  # are everything `desktop:ci` runs. `boundary` passes only when all of them do.
  boundary-part:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script:
          - desktop:ci:web
          - desktop:build desktop:lint:rust
          - desktop:build desktop:test:rust
          - desktop:build desktop:test:rust:sync
          - desktop:build desktop:host:stage desktop:test:glib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> ${{ runner.temp }}/sesame-desktop-boundary-target
          key: ${{ strategy.job-index }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the webview and tray libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Verify the desktop boundary
        env:
          TMPDIR: ${{ runner.temp }}
        run: npm run desktop:boundary:verify -- --script ${{ matrix.script }}

  boundary:
    needs: [boundary-part]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every boundary part to pass
        env:
          RESULT: ${{ needs.boundary-part.result }}
        run: |
          echo "Boundary parts: $RESULT"
          test "$RESULT" = "success"
