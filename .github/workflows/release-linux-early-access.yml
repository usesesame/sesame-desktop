name: Unsigned Linux early-access release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VITE_SESAME_SITE_ORIGIN: https://usesesame.app
  VITE_SESAME_API_URL: https://api.usesesame.app
  VITE_SESAME_PRIVACY_EMAIL: privacy@usesesame.app
  SESAME_API_BASE_URL: https://api.usesesame.app
  SESAME_RELEASE_ARCHITECTURE: x86_64
  SESAME_RELEASE_CHANNEL: beta
  SESAME_RELEASE_NOTES_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Require the tagged commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Require an exact source-version tag
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF" != "refs/tags/v$version" ]; then
            echo "Release tag does not match package version $version." >&2
            exit 1
          fi

  build-and-test:
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # Public half of the account-service capability signing key, stored as a
      # repository secret. It must hold the same value the server publishes.
      SESAME_CAPABILITY_PUBLIC_KEY: ${{ secrets.SESAME_CAPABILITY_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: linux-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the webview, tray, and package tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsecret-tools \
            patchelf \
            xdg-utils \
            rpm \
            xvfb

      - run: npm ci

      # A missing capability key makes every link attempt fail at run time, so
      # fail the release instead of shipping a desktop that cannot link.
      - name: Require the account capability configuration
        run: |
          if ! [[ "${SESAME_CAPABILITY_PUBLIC_KEY:-}" =~ ^[A-Za-z0-9_-]{43}$ ]]; then
            echo "SESAME_CAPABILITY_PUBLIC_KEY is missing or not a 32-byte base64url key." >&2
            exit 1
          fi

      - name: Run the complete release gate
        run: npm run release:check

      - name: Generate the reviewed dependency evidence
        run: npm run supply-chain:sbom

      - name: Verify the vendored glib tree
        run: node tools/verify-glib-vendor.mjs

      - name: Pin the Linux bundling tools by version and hash
        run: node tools/prepare-linux-bundle-tools.mjs

      - name: Build the immutable Linux packages
        run: >-
          npx tauri build --bundles deb,rpm,appimage
          --config '{"bundle":{"createUpdaterArtifacts":false,"useLocalToolsDir":true}}'
          -- --locked

      - name: Freeze the packages before the test build replaces the bundle
        run: |
          mkdir release-packages
          cp src-tauri/target/release/bundle/appimage/*.AppImage release-packages/
          cp src-tauri/target/release/bundle/deb/*.deb release-packages/
          cp src-tauri/target/release/bundle/rpm/*.rpm release-packages/
          node tools/release-set-cli.mjs discover linux src-tauri/target/release/bundle "$SESAME_RELEASE_ARCHITECTURE" release-packages.json

      # Bundled libwayland-client and libwayland-cursor break WebKit's EGL
      # display creation on hosts with a newer Wayland stack, so the shipped
      # AppImage must resolve them from the host.
      - name: Strip the host-provided Wayland libraries from the AppImage
        run: node tools/strip-appimage-host-libs.mjs "$(ls release-packages/*.AppImage)"

      - name: Prove the shipped deb installs, launches, and unregisters
        run: |
          xvfb-run -a node tools/linux-shipped-package-gate.mjs \
            --format deb \
            --package "$(ls release-packages/*.deb)" \
            --out linux-shipped-evidence

      - name: Prove the shipped rpm installs, launches, and unregisters
        run: |
          xvfb-run -a node tools/linux-shipped-package-gate.mjs \
            --format rpm \
            --package "$(ls release-packages/*.rpm)" \
            --out linux-rpm-shipped-evidence

      - name: Prove the shipped AppImage launches and refuses registration
        run: |
          xvfb-run -a node tools/linux-shipped-package-gate.mjs \
            --format appimage \
            --package "$(ls release-packages/*.AppImage)" \
            --out linux-appimage-shipped-evidence

      # The shipped binary has no test bridge, so vault behavior is proven on
      # the test-featured package through the same installed-package layout.
      - name: Prove the installed package vault lifecycle
        env:
          VITE_SESAME_WDIO: 'true'
        run: |
          npx tauri build --features wdio --config src-tauri/tauri.wdio.conf.json --bundles deb -- --locked
          xvfb-run -a node tools/linux-installed-package-gate.mjs \
            --package "$(ls src-tauri/target/release/bundle/deb/*.deb)" \
            --out linux-vault-evidence

      - name: Freeze the release manifest and lifecycle evidence
        run: |
          version=$(node -p "require('./package.json').version")
          SESAME_SHIPPED_PACKAGE_EVIDENCE=linux-shipped-evidence/linux-shipped-package.json \
          SESAME_RPM_PACKAGE_EVIDENCE=linux-rpm-shipped-evidence/linux-rpm-shipped-package.json \
          SESAME_APPIMAGE_PACKAGE_EVIDENCE=linux-appimage-shipped-evidence/linux-appimage-shipped-package.json \
          SESAME_VAULT_PACKAGE_EVIDENCE=linux-vault-evidence/linux-installed-package.json \
          node tools/prepare-linux-release-evidence.mjs \
            "$(ls release-packages/*.AppImage)" \
            "$(ls release-packages/*.deb)" \
            "$(ls release-packages/*.rpm)" \
            "release-evidence/sesame-$version.cdx.json" \
            release-handoff

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sesame-linux-build-${{ github.ref_name }}
          path: release-handoff
          if-no-files-found: error
          retention-days: 14

  sign-and-attest:
    needs: build-and-test
    runs-on: ubuntu-24.04
    environment: release-build
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Download the frozen Linux handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sesame-linux-build-${{ github.ref_name }}
          path: release-handoff

      - name: Re-hash every downloaded package against the frozen manifest
        run: node tools/verify-linux-handoff.mjs release-handoff "$(basename "$(ls release-handoff/*.release.json)")"

      - name: Install the pinned Sigstore client
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2, Cosign v3.0.6

      - name: Keylessly sign every package and the release manifest
        run: |
          manifest=$(ls release-handoff/*.release.json)
          for package in release-handoff/*.AppImage release-handoff/*.deb release-handoff/*.rpm; do
            cosign sign-blob --yes "$package" --bundle "$package.sigstore.json"
          done
          cosign sign-blob --yes "$manifest" --bundle "$manifest.sigstore.json"
          node tools/create-linux-sigstore-evidence.mjs release-handoff "$(basename "$manifest")"

      - name: Create the signed Linux candidate
        env:
          SESAME_RELEASE_CANDIDATE_SIGNING_KEY: ${{ secrets.SESAME_RELEASE_CANDIDATE_SIGNING_KEY }}
          SESAME_RELEASE_CANDIDATE_SIGNING_KEY_ID: ${{ vars.SESAME_RELEASE_CANDIDATE_KEY_ID }}
          SESAME_PUBLIC_RELEASE_ASSET_BASE: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
          SESAME_RELEASE_ARTIFACT_OBJECT_KEY_PREFIX: linux/${{ github.ref_name }}
        run: |
          manifest=$(ls release-handoff/*.release.json)
          node tools/create-linux-release-candidate.mjs release-handoff "$(basename "$manifest")"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sesame-linux-release-${{ github.ref_name }}
          path: |
            release-handoff
            release-artifacts
          if-no-files-found: error
          retention-days: 14

  verify-fresh:
    needs: sign-and-attest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sesame-linux-release-${{ github.ref_name }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2, Cosign v3.0.6

      - name: Independently verify every layer from the downloaded bytes
        run: |
          manifest=$(ls release-handoff/*.release.json)
          node tools/verify-linux-release-evidence.mjs release-handoff "$(basename "$manifest")"

  publish:
    needs: [sign-and-attest, verify-fresh]
    runs-on: ubuntu-24.04
    environment: release-publish
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SESAME_RELEASE_VISIBILITY: draft
    steps:
      - name: Record when this job started
        run: echo "JOB_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sesame-linux-release-${{ github.ref_name }}

      - name: Publish the release those candidate URLs already point at
        shell: bash
        run: |
          manifest=$(ls release-handoff/*.release.json)
          setdigest=$(node -p "JSON.parse(require('fs').readFileSync('$(ls release-artifacts/*.candidate.json)','utf8')).setDigest")
          version=$(node -p "require('./package.json').version")
          changes=$(awk -v want="## $version" '$0 == want { inside = 1; next } /^## / { if (inside) exit } inside' CHANGELOG.md)
          if [ -z "$(printf '%s' "$changes" | tr -d '[:space:]')" ]; then
            echo "CHANGELOG.md has no section for $version." >&2
            exit 1
          fi
          {
            echo "$changes"
            echo
            echo "Early access build for Linux x86_64: deb, rpm, and AppImage packages."
            echo
            echo "This GitHub release is an unpublished draft until a maintainer publishes it"
            echo "deliberately, so no public download is reachable from it yet."
            echo
            echo "The packages are not signed by a distribution key. Every file was built in"
            echo "public CI from tag $GITHUB_REF_NAME and signed keylessly with Sigstore."
            echo
            echo "SHA-256 digests are in SHA256SUMS-linux."
            echo
            echo "Release set digest: $setdigest"
          } > release-notes.md
          node tools/publish-linux-release.mjs release-handoff "$(basename "$manifest")" "$(ls release-artifacts/*.candidate.json)" release-notes.md

      - name: Prove the release stays unpublished
        shell: bash
        run: |
          read -r draft published_at < <(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,publishedAt --jq '[.isDraft, .publishedAt] | @tsv')
          if [ "$draft" != "true" ]; then
            if [[ "$published_at" < "$JOB_STARTED_AT" ]]; then
              echo "Release $GITHUB_REF_NAME was published at $published_at, before this job started at $JOB_STARTED_AT, so this job did not publish it."
              echo "Release $GITHUB_REF_NAME was already published by a maintainer. This job added files to it and did not publish it." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "This job published the release; the unsigned packages must stay an unpublished draft until approval." >&2
            exit 1
          fi
          manifest=$(ls release-handoff/*.release.json)
          asset=$(jq -r '.artifacts[0].filename' "$manifest")
          code=$(curl -sS -o /dev/null -w '%{http_code}' "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$asset")
          if [ "$code" != "404" ]; then
            echo "$asset is publicly reachable (HTTP $code) while the release is an unpublished draft." >&2
            exit 1
          fi
          echo "Release $GITHUB_REF_NAME is an unpublished draft; $asset is not publicly reachable."
          echo "Release $GITHUB_REF_NAME is an unpublished draft. Public Linux downloads stay off until a maintainer publishes the release deliberately." >> "$GITHUB_STEP_SUMMARY"

      - name: Submit the cryptographically verified candidate
        env:
          SESAME_RELEASE_API_URL: ${{ secrets.SESAME_RELEASE_API_URL }}
          SESAME_RELEASE_CANDIDATE_TOKEN: ${{ secrets.SESAME_RELEASE_CANDIDATE_TOKEN }}
        run: node tools/submit-release-candidate.mjs release-artifacts/*.candidate.json
