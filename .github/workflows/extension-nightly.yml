name: Extension nightly

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

concurrency:
  group: extension-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  station:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          key: extension-station
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the webview libraries and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            dbus \
            bubblewrap \
            xdg-dbus-proxy \
            xvfb

      - name: Allow unprivileged user namespaces for the web view sandbox
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --unshare-pid --unshare-net --ro-bind / / --dev /dev --proc /proc /usr/bin/true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: usesesame/sesame-browser-extension
          ref: main
          path: sesame-browser-extension
          persist-credentials: false

      - run: npm ci

      - name: Install the extension dependencies and a Chromium that can load it
        working-directory: sesame-browser-extension
        run: |
          npm ci
          npx playwright-core install --with-deps chromium

      - name: Fill a login from the real extension
        run: |
          xvfb-run -a dbus-run-session -- node tools/test-extension-native-host.mjs \
            --extension-directory sesame-browser-extension \
            --evidence-directory extension-station-evidence

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: extension-station-evidence
          path: extension-station-evidence
          if-no-files-found: ignore
          retention-days: 14
