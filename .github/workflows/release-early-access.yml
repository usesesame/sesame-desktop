name: Unsigned Windows early-access release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VITE_SESAME_SITE_ORIGIN: https://usesesame.app
  VITE_SESAME_API_URL: https://api.usesesame.app
  VITE_SESAME_PRIVACY_EMAIL: privacy@usesesame.app
  SESAME_API_BASE_URL: https://api.usesesame.app
  SESAME_RELEASE_ARCHITECTURE: x86_64
  SESAME_RELEASE_CHANNEL: beta
  # Compiled into the binary, so it has to stay valid for every future release
  # rather than name this one. /releases/latest only resolves for a release
  # that is not marked as a pre-release, which is why publish no longer does.
  SESAME_UPDATE_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
  SESAME_SUPPORTED_WINDOWS: Windows 10,Windows 11
  # The GitHub release carries the real notes, checksum, and verification
  # instructions. The marketing site has no per-version page, so pointing there
  # produced a 404 on every release.
  SESAME_RELEASE_NOTES_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
  SESAME_UPDATER_SIGNING_KEY_ID: ${{ vars.SESAME_UPDATER_SIGNING_KEY_ID }}

jobs:
  # Nothing is built until the tag is proven to point at main and to carry the
  # version the package declares, so a tag pushed from a side branch cannot
  # release a binary that never went through main.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Require the tagged commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Require an exact source-version tag
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF" != "refs/tags/v$version" ]; then
            echo "Release tag does not match package version $version." >&2
            exit 1
          fi

  # Every published binary must open and migrate the historical fixture corpus
  # on each supported platform. The job builds the app with the test bridge
  # because the shipped build deliberately has no loopback control surface, and
  # it fails instead of skipping when the app cannot run.
  vault-compatibility:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      VITE_SESAME_WDIO: 'true'
      # WebKitGTK needs a working DMA-BUF path; the runner's virtual GPU has none.
      WEBKIT_DISABLE_DMABUF_RENDERER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: vault-compatibility-${{ matrix.platform }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the webview and tray libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsecret-tools \
            patchelf \
            xdg-utils \
            xvfb

      - run: npm ci

      - name: Stage the browser host sidecar
        run: npm run desktop:host:stage

      - name: Build the app with the test bridge
        run: npx tauri build --features wdio --config src-tauri/tauri.wdio.conf.json --no-bundle

      - name: Restore every historical fixture through the app
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            xvfb-run -a node tools/run-vault-restore-gate.mjs --binary src-tauri/target/release/sesame --out vault-compatibility
          else
            node tools/run-vault-restore-gate.mjs --binary src-tauri/target/release/sesame.exe --out vault-compatibility
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vault-compatibility-${{ matrix.platform }}
          path: vault-compatibility
          if-no-files-found: error
          retention-days: 90

  # The complete cargo and npm release build runs here with no private signing
  # key and no OIDC token in the job, so a compromised build script, proc macro
  # or npm package cannot read the updater key, mint the release identity, or
  # sign a swapped installer.
  build:
    needs: [vault-compatibility]
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # Public half of the account-service capability signing key, stored as a
      # repository secret. It must hold the same value the server publishes.
      SESAME_CAPABILITY_PUBLIC_KEY: ${{ secrets.SESAME_CAPABILITY_PUBLIC_KEY }}
    outputs:
      installer: ${{ steps.installer.outputs.name }}
      installer-sha256: ${{ steps.installer.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      # The release gate runs cargo fmt and clippy, neither of which ships with
      # the bare toolchain.
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install locked dependencies
        run: npm ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vault-compatibility-*
          path: vault-compatibility

      - name: Merge the installed-app compatibility evidence
        shell: pwsh
        run: |
          $runs = @(Get-ChildItem -Path vault-compatibility -Recurse -Filter *.json | ForEach-Object { $_.FullName })
          if ($runs.Count -eq 0) { throw "The vault compatibility jobs uploaded no run records." }
          node tools/vault-compatibility-gate.mjs merge vault-compatibility-merged.json $runs

      # A missing capability key makes every link attempt fail at run time, so
      # fail the release instead of shipping a desktop that cannot link.
      - name: Require the account capability configuration
        shell: pwsh
        run: |
          if ($env:SESAME_CAPABILITY_PUBLIC_KEY -notmatch '^[A-Za-z0-9_-]{43}$') {
            throw "SESAME_CAPABILITY_PUBLIC_KEY is missing or not a 32-byte base64url key."
          }

      - name: Run the complete release gate
        run: npm run release:check

      - name: Generate the reviewed dependency evidence
        run: npm run supply-chain:sbom

      # option_env! turns any missing value into a build with updates silently
      # switched off, which is how 0.1.0 shipped unable to update itself. Fail
      # the release instead of discovering it from a user's screenshot. These
      # are the public halves; the private keys belong to the signing job.
      - name: Require a complete signed-update configuration
        shell: pwsh
        env:
          SESAME_UPDATER_PUBLIC_KEY: ${{ secrets.SESAME_UPDATER_PUBLIC_KEY }}
          SESAME_RELEASE_CANDIDATE_PUBLIC_KEY: ${{ secrets.SESAME_RELEASE_CANDIDATE_PUBLIC_KEY }}
          SESAME_RELEASE_CANDIDATE_KEY_ID: ${{ vars.SESAME_RELEASE_CANDIDATE_KEY_ID }}
        run: |
          $required = 'SESAME_UPDATER_PUBLIC_KEY', 'SESAME_RELEASE_CANDIDATE_PUBLIC_KEY', 'SESAME_RELEASE_CANDIDATE_KEY_ID', 'SESAME_UPDATE_MANIFEST_URL'
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "$name is empty. The build would ship without a working updater."
            }
          }

      # createUpdaterArtifacts stays off: the minisign signature is produced in
      # the signing job from the frozen bytes this step uploads, so no signing
      # key is ever present while this build runs.
      - name: Build the immutable unsigned Windows installer
        shell: pwsh
        env:
          SESAME_UPDATER_PUBLIC_KEY: ${{ secrets.SESAME_UPDATER_PUBLIC_KEY }}
          SESAME_RELEASE_CANDIDATE_PUBLIC_KEY: ${{ secrets.SESAME_RELEASE_CANDIDATE_PUBLIC_KEY }}
          SESAME_RELEASE_CANDIDATE_KEY_ID: ${{ vars.SESAME_RELEASE_CANDIDATE_KEY_ID }}
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'unsigned-windows-updater-off.json'
          Set-Content -LiteralPath $config -Value '{"bundle":{"createUpdaterArtifacts":false}}' -Encoding ascii -NoNewline
          npx tauri build --bundles nsis --config $config

      - name: Record the installer digest for the signing job
        id: installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installers.Count)." }
          $sha256 = (Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "name=$($installers[0].Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha256=$sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sesame-build-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            release-evidence/*.cdx.json
            vault-compatibility-merged.json
          if-no-files-found: error
          retention-days: 14

  # Signing and attestation run after the build. The minisign key exists only
  # in the step that signs and the candidate signing key only in the receipt
  # step; the installer digest is re-checked before and after the signing step
  # so a key never covers bytes other than the ones the build job recorded.
  sign-and-attest:
    needs: build
    runs-on: windows-latest
    environment: release-build
    permissions:
      contents: read
      id-token: write
    outputs:
      manifest: ${{ steps.evidence.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Download the built installer and evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sesame-build-${{ github.ref_name }}
          path: build-output

      - name: Re-hash the downloaded installer
        id: installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path build-output -Recurse -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw "The build artifact contains $($installers.Count) NSIS installers, expected one." }
          if ($installers[0].Name -ne '${{ needs.build.outputs.installer }}') { throw "The downloaded installer is not the installer the build job recorded." }
          $sha256 = (Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha256 -ne '${{ needs.build.outputs.installer-sha256 }}') { throw "The downloaded installer does not match the SHA-256 the build job recorded." }
          "path=$($installers[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # This job runs no build: npm ci skips package lifecycle scripts and no
      # cargo target is compiled in a step that can read a signing key.
      - name: Install the release tools without running package scripts
        run: npm ci --ignore-scripts

      # tauri-build validates the declared sidecar in any cargo build, and this
      # is the command that produces it.
      - name: Stage the browser host sidecar
        run: npm run desktop:host:stage

      - name: Sign the installer with the pinned updater key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri signer sign "${{ steps.installer.outputs.path }}"

      - name: Verify the updater signature against the pinned public key
        shell: pwsh
        env:
          SESAME_UPDATER_PUBLIC_KEY: ${{ secrets.SESAME_UPDATER_PUBLIC_KEY }}
        run: |
          $installer = '${{ steps.installer.outputs.path }}'
          $sha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha256 -ne '${{ needs.build.outputs.installer-sha256 }}') { throw "The installer changed after the build job hashed it." }
          cargo run --quiet --manifest-path src-tauri/Cargo.toml --bin verify-updater-artifact -- $installer "$installer.sig"

      - id: evidence
        name: Freeze the installer, updater signature, manifest, and SBOM
        shell: pwsh
        env:
          SESAME_VAULT_COMPATIBILITY_FILE: build-output/vault-compatibility-merged.json
        run: |
          $discovery = Join-Path $env:RUNNER_TEMP 'sesame-release-packages.json'
          node tools/release-set-cli.mjs discover windows build-output/src-tauri/target/release/bundle $env:SESAME_RELEASE_ARCHITECTURE $discovery
          $packageSet = Get-Content -Raw -LiteralPath $discovery | ConvertFrom-Json
          $installer = $packageSet.packages[0].path
          $signature = $packageSet.packages[0].updaterSignaturePath
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $sbom = "build-output/release-evidence/sesame-$version.cdx.json"
          $manifest = (node tools/prepare-release-evidence.mjs $installer $signature $sbom release-handoff).Trim()
          Copy-Item -LiteralPath tools/verify-sesame-release.ps1 -Destination release-handoff/verify-sesame-release.ps1
          "manifest=$manifest" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install the pinned Sigstore client
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2, Cosign v3.0.6

      - name: Keylessly sign the final installer and release manifest
        shell: pwsh
        run: |
          $manifest = '${{ steps.evidence.outputs.manifest }}'
          $record = Get-Content -Raw -LiteralPath "release-handoff/$manifest" | ConvertFrom-Json
          $artifact = "release-handoff/$($record.artifact.filename)"
          cosign sign-blob --yes $artifact --bundle "$artifact.sigstore.json"
          cosign sign-blob --yes "release-handoff/$manifest" --bundle "release-handoff/$manifest.sigstore.json"

      - name: Verify Sigstore and write the immutable evidence record
        shell: pwsh
        run: |
          $manifest = '${{ steps.evidence.outputs.manifest }}'
          $record = Get-Content -Raw -LiteralPath "release-handoff/$manifest" | ConvertFrom-Json
          $artifact = "release-handoff/$($record.artifact.filename)"
          node tools/create-sigstore-evidence.mjs $artifact "release-handoff/$manifest" "$artifact.sigstore.json" "release-handoff/$manifest.sigstore.json" release-handoff/sigstore-evidence.json

      - name: Create the signed candidate receipt
        env:
          SESAME_UPDATER_PUBLIC_KEY: ${{ secrets.SESAME_UPDATER_PUBLIC_KEY }}
          SESAME_RELEASE_CANDIDATE_PUBLIC_KEY: ${{ secrets.SESAME_RELEASE_CANDIDATE_PUBLIC_KEY }}
          SESAME_RELEASE_CANDIDATE_SIGNING_KEY_ID: ${{ vars.SESAME_RELEASE_CANDIDATE_KEY_ID }}
          SESAME_RELEASE_CANDIDATE_SIGNING_KEY: ${{ secrets.SESAME_RELEASE_CANDIDATE_SIGNING_KEY }}
        shell: pwsh
        run: |
          $manifest = '${{ steps.evidence.outputs.manifest }}'
          $record = Get-Content -Raw -LiteralPath "release-handoff/$manifest" | ConvertFrom-Json
          $artifact = "release-handoff/$($record.artifact.filename)"
          $signature = "release-handoff/$($record.updaterSignature.filename)"
          $env:SESAME_RELEASE_ARTIFACT_OBJECT_KEY = "windows/$($record.version)/$($record.artifact.filename)"
          # The candidate signs this URL, so it has to be set before the
          # candidate is built rather than only for the update manifest.
          $env:SESAME_PUBLIC_UPDATE_ARTIFACT_URL = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$($record.artifact.filename)"
          node tools/create-updater-artifacts.mjs $artifact $signature release-handoff/sigstore-evidence.json
          $candidate = "release-artifacts/sesame-$($record.version)-windows-$($record.architecture).candidate.json"
          node tools/release-set-cli.mjs verify $candidate
          Copy-Item -LiteralPath $candidate -Destination release-handoff/
          $env:SESAME_UPDATE_RECEIPT_V3_FILE = "release-artifacts/sesame-$($record.version)-windows-$($record.architecture).update-receipt.json"
          if (-not (Test-Path -LiteralPath $env:SESAME_UPDATE_RECEIPT_V3_FILE)) { throw "The v3 update receipt was not produced: $($env:SESAME_UPDATE_RECEIPT_V3_FILE)." }
          node tools/create-static-update-manifest.mjs $candidate release-handoff/latest.json

      - name: Prepare and audit the public-only evidence set
        shell: pwsh
        run: |
          node tools/prepare-public-release-evidence.mjs release-handoff public-release-evidence '${{ steps.evidence.outputs.manifest }}'
          node tools/audit-public-release-evidence.mjs public-release-evidence

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sesame-release-${{ github.ref_name }}
          path: |
            release-handoff
            public-release-evidence
          if-no-files-found: error
          retention-days: 14

  verify-fresh:
    needs: sign-and-attest
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sesame-release-${{ github.ref_name }}

      # Verification builds verify-updater-artifact, and the Tauri build script
      # refuses to run without the browser host sidecar in place.
      - name: Stage the browser host sidecar
        run: npm run desktop:host:stage

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2, Cosign v3.0.6

      - name: Independently verify every release layer
        env:
          SESAME_UPDATER_PUBLIC_KEY: ${{ secrets.SESAME_UPDATER_PUBLIC_KEY }}
        run: node tools/verify-release-evidence.mjs release-handoff '${{ needs.sign-and-attest.outputs.manifest }}' --internal

      - name: Re-audit the exact public evidence payload
        run: node tools/audit-public-release-evidence.mjs public-release-evidence

  publish-candidate:
    needs: [sign-and-attest, verify-fresh]
    runs-on: ubuntu-latest
    environment: release-publish
    permissions:
      contents: write
    env:
      SESAME_RELEASE_VISIBILITY: draft
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sesame-release-${{ github.ref_name }}

      # The static update manifest and the candidate receipt both point at
      # https://github.com/<repo>/releases/download/<tag>/<installer>, so the
      # release has to exist or every one of those URLs is a 404.
      - name: Publish the release those URLs already point at
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST: ${{ needs.sign-and-attest.outputs.manifest }}
        shell: bash
        run: |
          installer=$(jq -r '.artifact.filename' "release-handoff/$MANIFEST")
          sha256=$(jq -r '.artifact.sha256' "release-handoff/$MANIFEST")
          setdigest=$(jq -r '.setDigest' release-handoff/*.candidate.json)
          changes=$(awk -v want="## ${GITHUB_REF_NAME#v}" '$0 == want { inside = 1; next } /^## / { if (inside) exit } inside' CHANGELOG.md)
          if [ -z "$(printf '%s' "$changes" | tr -d '[:space:]')" ]; then
            echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}." >&2
            exit 1
          fi
          {
            echo "$changes"
            echo
            echo "Early access build for Windows 10 and 11, x64."
            echo
            echo "This GitHub release is an unpublished draft. No public installer or updater"
            echo "manifest is reachable from it until the installer is Authenticode signed and"
            echo "a maintainer publishes the release deliberately."
            echo
            echo "This installer is not Authenticode signed, so SmartScreen will warn you."
            echo "That is expected on this channel and does not mean the download is unverified."
            echo "Every file here was built in public CI from tag $GITHUB_REF_NAME and signed"
            echo "keylessly with Sigstore, binding it to this repository and that commit."
            echo
            echo "Verify it before running. The script needs every file on this release, so"
            echo "fetch the whole set into an empty folder rather than picking files by hand:"
            echo
            echo "    gh release create --help >NUL 2>&1 || winget install GitHub.cli"
            echo "    gh release download $GITHUB_REF_NAME --repo $GITHUB_REPOSITORY"
            echo "    winget install sigstore.cosign"
            echo
            echo "Cosign ships as cosign-windows-amd64.exe and may not land on PATH. The script"
            echo "looks for a command named cosign, so if it cannot find one, put a copy beside"
            echo "the installer and add it for this window only:"
            echo
            echo '    curl.exe -L -o cosign.exe https://github.com/sigstore/cosign/releases/latest/download/cosign-windows-amd64.exe'
            echo '    $env:Path = "$PWD;$env:Path"'
            echo
            echo "Then, in that folder:"
            echo
            echo '    Unblock-File .\verify-sesame-release.ps1'
            echo '    .\verify-sesame-release.ps1 -Installer .\'"$installer"' -EvidenceDirectory .'
            echo
            echo "Both parameters are required. A pass ends with the workflow-verified line."
            echo "Without Cosign the script stops rather than skipping the publisher check; add"
            echo "-HashOnly to check the hash alone, which proves the file is intact but not"
            echo "who published it."
            echo
            echo "SHA-256 of $installer"
            echo "    $sha256"
            echo
            echo "Release set digest: $setdigest"
          } > release-notes.md
          node tools/reconcile-github-release.mjs release-handoff public-release-evidence "$MANIFEST" "$(ls release-handoff/*.candidate.json)" release-notes.md

      - name: Prove the release stays unpublished until signing
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST: ${{ needs.sign-and-attest.outputs.manifest }}
        shell: bash
        run: |
          draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
          if [ "$draft" != "true" ]; then
            echo "The release is published; the unsigned installer must stay an unpublished draft until Authenticode signing and approval." >&2
            exit 1
          fi
          installer=$(jq -r '.artifact.filename' "release-handoff/$MANIFEST")
          for asset in "$installer" latest.json; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$asset")
            if [ "$code" != "404" ]; then
              echo "$asset is publicly reachable (HTTP $code) while the release is an unpublished draft." >&2
              exit 1
            fi
          done
          echo "Release $GITHUB_REF_NAME is an unpublished draft; $installer and latest.json are not publicly reachable."
          echo "Release $GITHUB_REF_NAME is an unpublished draft. Public Windows downloads and the updater manifest stay off until Authenticode signing and an explicit publish by a maintainer." >> "$GITHUB_STEP_SUMMARY"

      - name: Submit the cryptographically verified candidate
        env:
          SESAME_RELEASE_API_URL: ${{ secrets.SESAME_RELEASE_API_URL }}
          SESAME_RELEASE_CANDIDATE_TOKEN: ${{ secrets.SESAME_RELEASE_CANDIDATE_TOKEN }}
        run: node tools/submit-release-candidate.mjs release-handoff/*.candidate.json
