title = "Sesame reviewed secret-scan exceptions"

[extend]
useDefault = true

[[allowlists]]
description = "Deliberately invalid fictional OpenSSH fixtures"
targetRules = ["private-key"]
condition = "AND"
regexTarget = "line"
paths = [
  '''src-tauri/src/commands/ssh_keys\.rs$''',
  '''src/lib/controllers/ssh-key-controller\.test\.ts$''',
  '''src-tauri/sesame-core/tests/imports\.rs$''',
]
regexes = ['''-----BEGIN OPENSSH PRIVATE KEY----- fictional''']

[[allowlists]]
description = "Superseded Bitwarden import fixture; marked fictional from the next commit on"
targetRules = ["private-key"]
condition = "AND"
commits = ["7557487da1777a655421420f7302ef73873d0c24", "c66669fa2ea6f8fa6867eda6999f04f692fa649b"]
paths = ['''src-tauri/sesame-core/tests/imports\.rs$''']

[[allowlists]]
description = "Private-key header literals used by the support intake rejection filter"
targetRules = ["private-key"]
condition = "AND"
regexTarget = "line"
paths = ['''backend/internal/httpapi/support_intake\.go$''']
regexes = [
  '''"otpauth://", "-----begin private key-----", "-----begin pgp private key block-----",''',
  '''"-----begin rsa private key-----", "-----begin openssh private key-----",''',
]

[[allowlists]]
description = "Public deterministic verification key in the cross-language Sync fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''src-tauri/contracts/sync/v2/envelope-signing-payload\.json$''']
regexes = ['''"verifyingKey": "[A-Za-z0-9_-]{43}"''']

[[allowlists]]
description = "Public Chromium extension identity key"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''extensions/sesame/manifests/(chrome|edge)\.json$''']
regexes = ['''"key": "MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8A''']

[[allowlists]]
description = "Internal isolated-world DOM property, not a credential"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''extensions/sesame/src/content/field-writer\.ts$''']
regexes = ['''__sesamePendingFillV1''']

[[allowlists]]
description = "Fictional password fixtures used by security and sanitization tests"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = [
  '''src-tauri/src/lib\.rs$''',
  '''src/lib/controllers/feedback-controller\.test\.ts$''',
]
regexes = [
  '''pattern\.password = "northwind-2026"''',
  '''password=hunter2fictional''',
]
