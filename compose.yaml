services:
  migrate:
    build:
      context: ./backend
    entrypoint: ["/sesame-migrate"]
    environment:
      DATABASE_URL: postgres://sesame:sesame-development-only@db:5432/sesame?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    environment:
      SESAME_API_ADDR: 0.0.0.0:8787
      SESAME_API_VERSION: 0.1.0-dev
      SESAME_ENV: development
      # The account portal, which is also the origin the server puts in its
      # account emails. The public marketing site is a separate origin that
      # may read published metadata and nothing else.
      SESAME_WEB_ORIGIN: http://localhost:4175
      SESAME_PUBLIC_SITE_ORIGIN: http://localhost:4173
      SESAME_SESSION_SECURE: "false"
      # Created by `npm run api:up` in the gitignored root .env file. This
      # remains an explicit per-environment signing key, never a source secret.
      SESAME_CAPABILITY_SIGNING_KEY: ${SESAME_CAPABILITY_SIGNING_KEY:?Run npm run api:up from the repository root to create the local key.}
      SESAME_ADMIN_ORIGIN: http://localhost:4174
      SESAME_ADMIN_SESSION_SECURE: "false"
      # The local-only Mailpit inbox is visible at http://localhost:8025.
      # Production SMTP still requires STARTTLS and explicit credentials.
      SESAME_SMTP_ADDR: mailpit:1025
      SESAME_SMTP_FROM: Sesame <accounts@localhost>
      SESAME_SMTP_ALLOW_INSECURE_LOCAL: "true"
      # Created by `npm run api:up` in the gitignored root .env file. The
      # admin API remains loopback-only in local development.
      SESAME_ADMIN_ENCRYPTION_KEY: ${SESAME_ADMIN_ENCRYPTION_KEY:?Run npm run api:up from the repository root to create local admin secrets.}
      SESAME_ADMIN_IP_PEPPER: ${SESAME_ADMIN_IP_PEPPER:?Run npm run api:up from the repository root to create local admin secrets.}
      # Optional release-pipeline configuration. Leave empty for ordinary
      # account development; never place production release keys in this file.
      SESAME_RELEASE_CANDIDATE_PUBLIC_KEY: ${SESAME_RELEASE_CANDIDATE_PUBLIC_KEY:-}
      SESAME_RELEASE_CANDIDATE_KEY_ID: ${SESAME_RELEASE_CANDIDATE_KEY_ID:-}
      SESAME_RELEASE_CANDIDATE_TOKEN: ${SESAME_RELEASE_CANDIDATE_TOKEN:-}
      SESAME_DESKTOP_UPDATE_BASE_URL: ${SESAME_DESKTOP_UPDATE_BASE_URL:-}
      DATABASE_URL: postgres://sesame:sesame-development-only@db:5432/sesame?sslmode=disable
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      db:
        condition: service_healthy
        restart: true
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.15.0
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sesame
      POSTGRES_USER: sesame
      POSTGRES_PASSWORD: sesame-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sesame-postgres:/var/lib/postgresql

volumes:
  sesame-postgres:
